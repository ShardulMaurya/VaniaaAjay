<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Vani-Ajay • PM-AJAY GIA Voice Portal</title>
    <style>
      /* Reset and lock body to true 100vw x 100vh */
      html, body, #root {
        width: 100vw !important;
        height: 100vh !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden !important;
        box-sizing: border-box;
      }

      /* Hide all browser scrollbars completely (No edge sliders) */
      * {
        scrollbar-width: none !important; /* Firefox */
        -ms-overflow-style: none !important; /* IE/Edge */
      }
      *::-webkit-scrollbar {
        display: none !important; /* Chrome, Safari, Opera */
        width: 0 !important;
        height: 0 !important;
      }

      /* Clean print styles for Acknowledgment Slip */
      @media print {
        body * {
          visibility: hidden;
        }
        #printableSlipArea, #printableSlipArea * {
          visibility: visible;
        }
        #printableSlipArea {
          position: absolute;
          left: 0;
          top: 0;
          width: 100% !important;
          border: 1px solid #000 !important;
          box-shadow: none !important;
        }
        .no-print {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
